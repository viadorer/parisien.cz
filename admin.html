<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Správa – parisien.cz</title>
  <link rel="icon" href="/images/logo.png">
  <style>
    :root { --navy:#1b2a49; --red:#b3262e; --bg:#f4f1ea; --line:#d9d2c3; --ink:#17192b; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--navy); color:#fff; padding:12px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size:1.1rem; margin:0 auto 0 0; }
    header a, header button.link { color:#fff; background:none; border:0; cursor:pointer; font:inherit; text-decoration:underline; }
    main { max-width:1100px; margin:0 auto; padding:20px; }
    .box { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
    .warn { background:#fff4d6; border-color:#e8c766; }
    label { display:block; font-weight:600; margin:12px 0 4px; font-size:.85rem; }
    input[type=text], input[type=password], input[type=datetime-local], input[type=url], select, textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
    textarea { min-height:230px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:.9rem; }
    textarea.short { min-height:70px; }
    button { font:inherit; cursor:pointer; }
    .btn { background:var(--red); color:#fff; border:0; border-radius:8px; padding:9px 18px; font-weight:600; }
    .btn.sec { background:#fff; color:var(--navy); border:1px solid var(--navy); }
    .btn.danger { background:#fff; color:var(--red); border:1px solid var(--red); }
    .btn:disabled { opacity:.5; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; }
    .tabs button { background:#fff; border:1px solid var(--line); border-radius:99px; padding:6px 16px; }
    .tabs button[aria-pressed=true] { background:var(--navy); color:#fff; border-color:var(--navy); }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .grow { flex:1; min-width:200px; }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    @media (max-width:800px) { .cols { grid-template-columns:1fr; } }
    .item { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
    .item:first-child { border-top:0; }
    .item small { color:#666; }
    .badge { font-size:.72rem; border-radius:99px; padding:2px 9px; background:#e7e2d6; }
    .badge.draft { background:#ffe1e1; color:var(--red); }
    .thumb { width:96px; height:64px; object-fit:cover; border-radius:6px; background:#eee; }
    .msg { padding:10px 0; border-top:1px solid var(--line); white-space:pre-wrap; }
    #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:8px; display:none; z-index:9; }
    #toast.err { background:var(--red); }
    .hint { color:#666; font-size:.8rem; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header>
    <h1>parisien.cz · správa</h1>
    <a href="/" target="_blank" rel="noopener">Zobrazit web</a>
    <button class="link" id="logout" hidden>Odhlásit</button>
  </header>
  <main>
    <div id="status"></div>

    <section id="login" class="box" hidden>
      <h2 style="margin-top:0">Přihlášení</h2>
      <form id="login-form" class="row">
        <input class="grow" type="password" id="pw" placeholder="Heslo" autocomplete="current-password" required>
        <button class="btn" type="submit">Přihlásit</button>
      </form>
    </section>

    <section id="app" hidden>
      <div class="tabs">
        <button data-tab="posts" aria-pressed="true">Články</button>
        <button data-tab="messages" aria-pressed="false">Zprávy z formuláře</button>
      </div>

      <div id="tab-posts">
        <div id="list" class="box"></div>
        <form id="editor" class="box" hidden>
          <h2 id="editor-title" style="margin-top:0">Nový článek</h2>
          <input type="hidden" id="f-id">
          <div class="row">
            <div class="grow"><label for="f-slug">Slug (adresa)</label><input type="text" id="f-slug" placeholder="vygeneruje se z nadpisu"></div>
            <div class="grow"><label for="f-date">Datum publikace</label><input type="datetime-local" id="f-date"></div>
            <label class="row" style="margin-top:26px"><input type="checkbox" id="f-pub" checked> Publikováno</label>
          </div>
          <div class="row">
            <div><label for="f-cat">Kategorie</label><select id="f-cat"><option value="paris">Paříž</option><option value="voyage">Cestování</option><option value="langue">Jazyk</option></select></div>
            <div class="grow"><label for="f-author">Autor</label><input type="text" id="f-author" placeholder="Rédaction parisien.cz / jméno studenta"></div>
          </div>
          <label for="f-cover">Titulní obrázek (https:// URL)</label>
          <div class="row">
            <input class="grow" type="url" id="f-cover" placeholder="https://…">
            <input type="file" id="f-file" accept="image/jpeg,image/png,image/webp" hidden>
            <button type="button" class="btn sec" id="f-upload">Nahrát do R2</button>
          </div>
          <div class="row">
            <div class="grow"><label for="f-credit">Kredit fotky (autor · licence)</label><input type="text" id="f-credit" placeholder="Jméno autora · CC BY-SA 4.0"></div>
            <div class="grow"><label for="f-credit-url">Odkaz na zdroj fotky</label><input type="url" id="f-credit-url" placeholder="https://commons.wikimedia.org/…"></div>
          </div>
          <img id="f-preview" class="thumb" alt="" hidden style="width:160px;height:107px;margin-top:8px">
          <div class="cols">
            <div>
              <h3>🇫🇷 Français</h3>
              <label for="f-title-fr">Titre</label><input type="text" id="f-title-fr" maxlength="200">
              <label for="f-ex-fr">Résumé</label><textarea class="short" id="f-ex-fr" maxlength="500"></textarea>
              <label for="f-body-fr">Texte</label><textarea id="f-body-fr"></textarea>
            </div>
            <div>
              <h3>🇨🇿 Čeština</h3>
              <label for="f-title-cs">Nadpis</label><input type="text" id="f-title-cs" maxlength="200">
              <label for="f-ex-cs">Perex</label><textarea class="short" id="f-ex-cs" maxlength="500"></textarea>
              <label for="f-body-cs">Text</label><textarea id="f-body-cs"></textarea>
            </div>
          </div>
          <label for="f-sources">Zdroje (jedna https:// URL na řádek)</label><textarea class="short" id="f-sources"></textarea>
          <p class="hint">Formát textu: odstavce oddělte prázdným řádkem, nadpis sekce <code>## Nadpis</code>, tučně <code>**text**</code>, odrážky <code>- položka</code>, odkaz <code>[text](https://…)</code>. HTML se nepodporuje. Stačí vyplnit jeden jazyk, druhý se zobrazí jako záloha.</p>
          <div class="row">
            <button class="btn" type="submit">Uložit</button>
            <button class="btn sec" type="button" id="cancel">Zavřít</button>
          </div>
        </form>
      </div>

      <div id="tab-messages" class="box" hidden></div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="/admin-app.js"></script>
</body>
</html>
